services:
  backend:
    build:
      context: .
      target: backend
    image: simulador-buses-backend
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      # Optional; taken from the host environment or .env, never stored in the image.
      TOMTOM_API_KEY: ${TOMTOM_API_KEY:-}
      # Buses run this many times faster than TomTom live traffic (1.6 = +60 %).
      SIMULADOR_FACTOR_VELOCIDAD: ${SIMULADOR_FACTOR_VELOCIDAD:-1.6}
    volumes:
      - simulador-data:/app/data
    restart: unless-stopped

  # Tkinter dashboard in the browser: http://localhost:6080
  frontend:
    build:
      context: .
      target: dashboard-web
    image: simulador-buses-frontend
    ports:
      - "127.0.0.1:6080:6080"
    environment:
      SIMULADOR_API_URL: http://backend:8000
      MAPA_PROVEEDOR: ${MAPA_PROVEEDOR:-}
      STADIA_MAPS_API_KEY: ${STADIA_MAPS_API_KEY:-}
      CARTO_API_KEY: ${CARTO_API_KEY:-}
      ARCGIS_API_KEY: ${ARCGIS_API_KEY:-}
    shm_size: "256m"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # Alternative: native window through a host X server.
  # Start with: docker compose --profile gui up dashboard
  # Requires VcXsrv/X410 on Windows (access control disabled) or XQuartz on macOS.
  dashboard:
    build:
      context: .
      target: dashboard
    image: simulador-buses-dashboard
    profiles: ["gui"]
    environment:
      SIMULADOR_API_URL: http://backend:8000
      DISPLAY: ${DISPLAY:-host.docker.internal:0.0}
      MAPA_PROVEEDOR: ${MAPA_PROVEEDOR:-}
      STADIA_MAPS_API_KEY: ${STADIA_MAPS_API_KEY:-}
      CARTO_API_KEY: ${CARTO_API_KEY:-}
      ARCGIS_API_KEY: ${ARCGIS_API_KEY:-}
    depends_on:
      backend:
        condition: service_healthy

  # Run with: docker compose --profile test run --rm tests
  tests:
    build:
      context: .
      target: test
    image: simulador-buses-tests
    profiles: ["test"]

volumes:
  simulador-data:
