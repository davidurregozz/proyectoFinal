services:
  backend:
    build:
      context: .
      target: backend
    image: simulador-buses-backend
    ports:
      # Set SIMULADOR_IP_PUBLICA=0.0.0.0 in .env to open the API and /movil/ to the local network.
      - "${SIMULADOR_IP_PUBLICA:-127.0.0.1}:8000:8000"
    environment:
      # Optional; taken from the host environment or .env, never stored in the image.
      TOMTOM_API_KEY: ${TOMTOM_API_KEY:-}
      # Buses run this many times faster than TomTom live traffic (1.6 = +60 %).
      SIMULADOR_FACTOR_VELOCIDAD: ${SIMULADOR_FACTOR_VELOCIDAD:-1.6}
      # Traffic hexagons: every hexagon on the routes is measured (TRAFICO_HEX_MAX is
      # only a safety cap) and the wait grows to keep TOMTOM_HORAS_USO in the quota.
      TOMTOM_REFRESCO_S: ${TOMTOM_REFRESCO_S:-600}
      TOMTOM_CUOTA_DIARIA: ${TOMTOM_CUOTA_DIARIA:-2500}
      TOMTOM_HORAS_USO: ${TOMTOM_HORAS_USO:-10}
      TRAFICO_HEX_RADIO_M: ${TRAFICO_HEX_RADIO_M:-600}
      TRAFICO_HEX_MAX: ${TRAFICO_HEX_MAX:-150}
    volumes:
      - simulador-data:/app/data
    restart: unless-stopped

  # Tkinter dashboard in the browser: http://localhost:6080
  frontend:
    build:
      context: .
      target: dashboard-web
    image: simulador-buses-frontend
    ports:
      # Same switch as the backend; set VNC_PASSWORD too, since 6080 controls the dashboard.
      - "${SIMULADOR_IP_PUBLICA:-127.0.0.1}:6080:6080"
    environment:
      SIMULADOR_API_URL: http://backend:8000
      VNC_PASSWORD: ${VNC_PASSWORD:-}
      MAPA_PROVEEDOR: ${MAPA_PROVEEDOR:-}
      STADIA_MAPS_API_KEY: ${STADIA_MAPS_API_KEY:-}
      CARTO_API_KEY: ${CARTO_API_KEY:-}
      ARCGIS_API_KEY: ${ARCGIS_API_KEY:-}
    shm_size: "256m"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # Alternative: native window through a host X server.
  # Start with: docker compose --profile gui up dashboard
  # Requires VcXsrv/X410 on Windows (access control disabled) or XQuartz on macOS.
  dashboard:
    build:
      context: .
      target: dashboard
    image: simulador-buses-dashboard
    profiles: ["gui"]
    environment:
      SIMULADOR_API_URL: http://backend:8000
      DISPLAY: ${DISPLAY:-host.docker.internal:0.0}
      MAPA_PROVEEDOR: ${MAPA_PROVEEDOR:-}
      STADIA_MAPS_API_KEY: ${STADIA_MAPS_API_KEY:-}
      CARTO_API_KEY: ${CARTO_API_KEY:-}
      ARCGIS_API_KEY: ${ARCGIS_API_KEY:-}
    depends_on:
      backend:
        condition: service_healthy

  # Internet access through Cloudflare quick tunnels: free, HTTPS, no account,
  # domain or router ports. The https://...trycloudflare.com address changes on
  # every start; show it with: sh docker/enlaces-internet.sh
  # Mobile app (read-only from the internet): docker compose --profile internet up -d
  tunel-app:
    image: cloudflare/cloudflared:2026.9.3
    profiles: ["internet"]
    command: tunnel --no-autoupdate --url http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # Admin dashboard, only when needed: add --profile internet-panel
  tunel-panel:
    image: cloudflare/cloudflared:2026.9.3
    profiles: ["internet-panel"]
    # It can edit routes: publish it only with VNC_PASSWORD set in .env.
    command: tunnel --no-autoupdate --url http://frontend:6080
    depends_on:
      frontend:
        condition: service_healthy
    restart: unless-stopped

  # Run with: docker compose --profile test run --rm tests
  tests:
    build:
      context: .
      target: test
    image: simulador-buses-tests
    profiles: ["test"]

volumes:
  simulador-data:
